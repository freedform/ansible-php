- name: Validate php_packages variable
  ansible.builtin.assert:
    that:
      - php_packages is defined
      - php_packages is mapping

- name: Install PHP repositories
  ansible.builtin.apt_repository:
    repo: "{{ php_repository }}"
    state: present
    update_cache: false
  when:
    - php_repositories is defined
    - php_repositories is not string
    - php_repositories is iterable
    - php_repositories | length > 0
  loop: "{{ php_repositories }}"
  loop_control:
    loop_var: php_repository
    label: "PHP repo {{ php_repository }}"

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Ensure PHP versions are present or absent
  ansible.builtin.apt:
    name: "php{{ php_version.key }}"
    state: "{{ php_version.value.state }}"
  loop: "{{ php_packages | dict2items }}"
  loop_control:
    loop_var: php_version
    label: "PHP {{ php_version.key }}"

- name: Manage PHP packages per version
  ansible.builtin.apt:
    name: "php{{ php_version_pkg.0.key }}-{{ php_version_pkg.1.name }}"
    state: "{{ php_version_pkg.1.state }}"
  loop: "{{ php_packages | dict2items | subelements('value.packages', skip_missing=True) }}"
  loop_control:
    loop_var: php_version_pkg
    label: "php{{ php_version_pkg.0.key }}-{{ php_version_pkg.1.name }} => {{ php_version_pkg.1.state }}"
  when: php_version_pkg.0.value.state == 'present'
