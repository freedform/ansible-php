- name: Deploy PHP FPM pools for "{{ php_version }}"
  ansible.builtin.template:
    src: fpm_pools.conf.j2
    dest: "{{ php_config_path }}/{{ php_version }}/fpm/pool.d/{{ php_fpm_pools_file }}"
    owner: "{{ php_config_owner_user }}"
    group: "{{ php_config_owner_group }}"
    mode: '0644'
    validate: "php-fpm{{ php_version }} -t -y %s"

- name: Find unmanaged PHP FPM pool files for "{{ php_version }}"
  ansible.builtin.find:
    paths: "{{ php_config_path }}/{{ php_version }}/fpm/pool.d"
    patterns: "*.conf"
    excludes: "{{ php_fpm_pools_file }}"
  register: php_fpm_unmanaged_pool_files

- name: Remove unmanaged PHP FPM pool files for "{{ php_version }}"
  ansible.builtin.file:
    path: "{{ php_fpm_unmanaged_pool_file.path }}"
    state: absent
  loop: "{{ php_fpm_unmanaged_pool_files.files }}"
  loop_control:
    loop_var: php_fpm_unmanaged_pool_file
    label: "{{ php_fpm_unmanaged_pool_file.path }}"
