- name: Validate variables for deploy_fpm_pools.yml task
  ansible.builtin.assert:
    that:
      - php_packages is defined
      - php_packages is mapping
      - php_fpm_pools is defined
      - php_fpm_pools is mapping
      - php_config_path is defined
      - php_config_owner_user is defined
      - php_config_owner_group is defined

- name: Deploy PHP FPM pools
  ansible.builtin.include_tasks: deploy_fpm_pool.yml
  vars:
    php_version: "{{ php_ver.key }}"
    php_fpm_dict: "{{ php_ver.value }}"
  loop: "{{ php_fpm_pools | dict2items }}"
  loop_control:
    loop_var: php_ver
    label: "PHP {{ php_ver.key }}"
  when: php_packages[php_ver.key].state == 'present'
